name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: CoffeeGrindAnalyzer-Linux
            asset_name: CoffeeGrindAnalyzer-Linux.zip
          - os: windows-latest
            artifact_name: CoffeeGrindAnalyzer-Windows
            asset_name: CoffeeGrindAnalyzer-Windows.zip
          - os: macos-latest
            artifact_name: CoffeeGrindAnalyzer-macOS
            asset_name: CoffeeGrindAnalyzer-macOS.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          pyinstaller --onefile --windowed --name=CoffeeGrindAnalyzer app.py

      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --onefile --windowed --name=CoffeeGrindAnalyzer app.py

      - name: Package artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd dist
          zip -r ../${{ matrix.asset_name }} CoffeeGrindAnalyzer
          cd ..

      - name: Package artifacts (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r ../${{ matrix.asset_name }} CoffeeGrindAnalyzer
          cd ..

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd dist
          Compress-Archive -Path CoffeeGrindAnalyzer.exe -DestinationPath ../${{ matrix.asset_name }}
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/CoffeeGrindAnalyzer-Linux/*.zip
            artifacts/CoffeeGrindAnalyzer-Windows/*.zip
            artifacts/CoffeeGrindAnalyzer-macOS/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
